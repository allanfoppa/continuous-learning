services:
  jekyll:
    image: jekyll/jekyll:latest
    container_name: continuous-learning
    working_dir: /srv/jekyll
    init: true
    ports:
      - "4000:4000"
      - "35729:35729"
    volumes:
      - .:/srv/jekyll
      - bundle_cache:/usr/local/bundle
    command: >
      sh -c "
        bundle install &&
        bundle exec jekyll serve --host 0.0.0.0 --livereload
      "

volumes:
  bundle_cache:
